# Resolve Fish at server startup instead of hard-coding an OS-specific path.
run-shell 'fish_path="$(command -v fish)"; if [ -n "$fish_path" ]; then tmux set-option -g default-shell "$fish_path"; fi'

set-option -g default-terminal "tmux-256color"
set-option -ag terminal-features ",xterm-ghostty:RGB"
set-option -g history-limit 10000
set-option -g mouse on
set-option -g focus-events on
setw -g mode-keys vi

# Open new panes in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Plugins are installed and updated by TPM.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'rose-pine/tmux'

set -g @rose_pine_variant 'dawn'
set -g @rose_pine_host 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_only_windows 'on'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_default_window_behavior 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'on'

# Separators and icons.
set -g @rose_pine_left_separator ' > '
set -g @rose_pine_right_separator ' < '
set -g @rose_pine_field_separator ' | '
set -g @rose_pine_window_separator ' - '
set -g @rose_pine_hostname_icon '󰒋'
set -g @rose_pine_date_time_icon '󰃰'
set -g @rose_pine_window_status_separator '  '

set -g @rose_pine_prioritize_windows 'on'
set -g @rose_pine_width_to_hide '80'
set -g @rose_pine_window_count '5'

# Keep this last so TPM can discover every plugin declared above.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
    'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
